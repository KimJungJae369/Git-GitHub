<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로컬 저장소</title>
</head>
<body>

    <!-- 
        <로컬 저장소 추가하기> 
        = 내 컴퓨터에 이미 생성해 둔 로컬 저장소를 소스트리에서도 볼 수 있다
        = 내 컴퓨터에 이미 있는 소스 코드를 '비주얼 스튜디오' 코드와 같은 에디터에서 여는 것과 동일
        1. 소스트리를 실행하고 'add' 아이콘을 클락한 후 작업 경로 오른쪽의 '탐색'버튼을 클릭
            Tip)
            - colne, create 아이콘을 클릭해 열리는 화면에서고 소스트리에 저장소를 추가할 수 있다
            Clone : 원격 저장소를 내 컴퓨터에 받아오기
            Add : 내 컴퓨터에서 이미 만든 로컬 저장소를 소스트리에 추가
            Create : 내 컴퓨터에 새로운 로컬 저장소를 만들고 소스트리에 추가       
        2. 폴더를 찾아 선택
        3. '추가' 버튼 클릭
        4. 로컬 저장소에서 버전 관리를 할 수 있는 새로운 탭
    
        <로컬 저장소의 정체는 [.git] 폴더>
        = 폴더 내부의 숨겨진 또 하나의 폴더인 [.git]에 저장된 정보를 통해 버전 관리를 할 수 있다
        = 이 폴더가 바로 '로컬 저장소' 
        = 'CLI' 환경에서 'git init' 명령을 통해 만들어지고 'GUI' 환경에서 'create' 아이콘을 클릭해 만들어진다
        = 'Git'은 [.git] 폴더에 버전 관리한 데이터와 이를 올릴 원격 저장소의 주소(GitHub에서 만든 저장소 URL)를 저장한다
            Tip)
                git init
                - 소스 트리에서는 'create' 아이콘을 클릭해 로컬 저장소를 만들고 싶은 폴더를 선택하면 쉽게 git을 초기화
                - 탭 오른쪽에 있는 + 버튼을 클릭해 새 탭을 열고 'create' 아이콘을 클릭
                - 다만 기존에 초기화되지 않은 순수한 폴더를 선택해야 한다 그렇지 않으면 또 [.git] 폴더를 만들려고 하면 오류가 발생한다
    -->
    
</body>
</html>
