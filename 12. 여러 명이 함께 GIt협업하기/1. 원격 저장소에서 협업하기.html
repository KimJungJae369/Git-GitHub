<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. 원격 저장소에서 협업하기</title>
</head>
<body>

    <!-- 
        1. 두 명이 동시에 버전 관리를 해야 한다면?
        = 두 명이 동시에 버전 관리를 할 때에도 서로의 작업물에 의존하지 않고 내가 원할 때 코드를 올리고 또 내가 원할 때 협업자의 코드와 합칠 수 있다

        2. Git이 커밋을 관리하는 방식 : 줄줄이 기차
        = 코드 변경 사항을 묶어 하나의 덩어리로 만드는 것(커밋)
        ex)
            커밋1(1/2일 버전) : index.html생성, app.js생성
                <- (바로 전 커밋을 가리키고 있다)
                    커밋2(1/3일 버전) : index.html 수정(2번째 줄 삭제)
                        <-
                            커밋3(1/5일 버전) : index.html에 새로운 코드 추가, app.js 수정(3번재 줄 삭제)
        = 한 명이 작업한다면 윕 예제처럼 한 줄로 계속 컷밋을 쌓아가면 된다
        = 그런데 두 명이 협업한다면?
            - 1/5일 버전(커밋3)을 기준으로 두 명의 각각 파일을 수정해서 커밋을 만들어야 한다고 가정하면 한 줄로는 커밋을 이어나가지 못한다
            - 새로운 두 커밋 모두 기준 커밋(커밋3)과 연결되어야 해서 그러면 자연스럽게 두 갈래로 나뉘게 된다
            ex)
                커밋1(1/2일 버전) : index.html생성, app.js생성
                    <- (바로 전 커밋을 가리키고 있다)
                        커밋2(1/3일 버전) : index.html 수정(2번째 줄 삭제)
                            <-
                                커밋3(1/5일 버전) : index.html에 새로운 코드 추가, app.js 수정(3번재 줄 삭제)
                                    <- (커밋3을 기준으로 두 갈래로 나뉜다)
                                        커밋4(1/6일 버전) : index.html에 새로운 코드 추가
                                        커밋5(1/6일 버전) : app.js에 새로운 코드 추가
        = 특정한 기준 시점에서 줄기를 나누어 작업할 수 있는 기능을 '브랜치'라고 한다
        = 새로운 가지로 커밋을 만들려면 반드시 브랜치를 먼저 만들어야 한다 

        3. 브랜치란?
        = 커밋을 만들었을 때 옆에 달려 있던 'main', 'origin/main'꼬리표가 브랜치이다
        = 'main'브랜치 꼬리표가 최신 커밋인 커밋2에 달려 있다면 'main'브랜치는 커밋2를 가리키고 있는 것이다
        ex)
            커밋1(main 브랜치) -> 커밋1 <- 커밋2(main 브랜치) 
        
        = 그런데 왜 'main' 브랜치에 커밋을 '올린다'라고 하지 않고 '가리킨다'라는 표현을 쓰는 걸까?
        = 이것은 브랜치가 나뭇가지처럼 물리적으로 '길'이 존재해서 그 길에 올리는 것이 아니라 단순한 '포인터'이기 때문이다
        = '포인터'를 한글로 직역하면 '가리키는 것'이다 즉 컴퓨터의 마우스 커서(포인터)를 생각하면 된다
        = 브랜치가 포인터라는 것은 그저 커밋을 카리키는 것만으로도 분기를 만들 수 있다는 장점
        = 분기를 만들려면 프로젝트를 통째로 복사해야 해서 'SubVersion'과 같은 버전 관리 툴은 무겁고 시간이 많이 걸린다 
        = 반면 Git은 가변고 빠르게 분기를 만들 수 있다
        = 그럼 냌 머퓨터에서 '커밋4(새 커밋)'브렌치와 '커밋3(main)' 브랜치를 사이를 어떻게 넘나들수 있을까?
        = 'HEAD'라는 특수한 포인터가 그 비법
        = 브랜치 혹은 커밋을 가리키는 포인터
        = 'HEAD'를 이용해서 브랜치 사이를 마음대로 넘나들 수 있따 
        = '타임머신'의 역할
        = 'HEAD' 포인터는 커밋5 'main' 브랜치를 가리키고 있다 따라서 '커밋5 main' 브랜치를 가리키고 있고 커밋5의 상태를 보야준다 'HEAD' 포인터가 커밋4 브랜치를 가리키게 하면 커밋4의 상태를 보여준다
        = 브랜치의 최신 커밋이 아닌 과거 커밋으로 'HEAD'를 이동시킬 수 있다
        = 다만 이 경우 'main' 브랜치의 포인터와 'HEAD'가 떨어져 있기에 '분리된 HEAD'상태 이다
        = 브랜치로 인해 다양한 작업을 동시에 진행할 수 있다
    -->
    
</body>
</html>
