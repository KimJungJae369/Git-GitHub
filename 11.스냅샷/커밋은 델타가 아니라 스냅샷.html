<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커밋은 델타가 아니라 스냅샷</title>
</head>
<body>

    <!-- 
        1. 하나의 버전을 만들기 위해 변경 사항을 선택하는 과정이 'git add'명령
        2. 그렇게 선택한 변경 사항을 하나로 묶어 버전으로 만든 것이 'git commit'명령
        3. 하지만 커밋 객체에 '변경 사항의 묶음'이 저장되어 있을 것이라고 생각하면 오산이다 
        4. 사실은 변경 사항만 부분적으로 저장하는게 아니라 변경된 파일이 통째로 저장되어 있다 

        <바뀐 것만 저장하면 될 것 같은데 왜 파일을 전부 저장할까?>
        1. 커밋은 델타가 아니라 스냅샷
        - 한때 개발 업계를 평정했던 'Subversion(SVN)'과 같은 버전 관리 시스템과 Git의 가장 큰 차이점은 Git이 커밋에 바뀐 것만 저장하는 것이 아니라 전체 코드를 저장한다는 것
        - 예를 들어 파일이 100줄이고 그 중 10줄이 바뀌었다면, Git은 전체 100줄을 저장한다. 하지만 SVN은 바뀐 10줄만 저장
        - 차이점만 저장하는 방식은 '델타'
        - 전체를 저장하는 방식은 '스냅샷'
        - 얼핏 보면 전체를 저장하는 Git보다 차이점만 저장하는 Subversion이 훤씬 용량도 적고 빠를 것 같지만 조금만 더 생각해 보면 차이점만 저장하는 방식은 버전을 보여줄 때 파일이 만들어 졌던 맨 처음까지 
        거슬러 올라가면 바뀐 점을 모두 반영하는 계산을 해야 한다는 걸 알 수 있다
        - 예를 들어 100줄이 바뀐 파일이 10개 있는 커밋이 있다고 생각해 보자. 이 커밋을 보여주려면 1000줄의 변경 사항을 계산해야 한다. 하지만 Git은 전체를 저장하기 때문에 단순히 10개의 파일을 보여주면 된다.

        2. Git으로 관리하는 파일의 네 가지 상태
        - Git으로 관리하는 파일은 총 네 가지 상태를 가진다
        - 각각의 파일이 네 가지 상태를 오고가면 버전 관리를 하게 되고 소스트리에선 아이콘을 통해 이 파일 상태를 보여준다

        4가지 상태
        <Untracked(추적되지 않음)>
        - Git이 관리하지 않는 파일

        <Unmodified(수정되지 않음)>
        - Git이 관리하는 파일이지만 변경되지 않은 상태

        <Modified(수정됨)>
        - Git이 관리하는 파일이지만 변경(수정)된 상태

        <Staged(스테이지에 올려짐)>
        - Git이 관리하는 파일이지만 변경된 상태이고, 커밋하기 위해 스테이지에 올려진 상태
    -->
    
</body>
</html>
