<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브렌치 합치기</title>
</head>
<body>

    <!-- 
        1. '병합'이란?
        = 간단히 말해서 두 번저의 합칩합을 구하는 것
        = 즉 쉽게 말해 두 번저의 공통된 부분을 구하는 것
        ex)
            A: 1 2 '3 4 5'
            B: '3 4 5' 6 7
            A와 B의 병합은 3 4 5
            - A와 B의 공통된 부분이 3 4 5이므로 A와 B의 병합은 3 4 5가 된다

            병합 커밋 
            - 병합 커밋은 두 브렌치의 공통된 부분을 나타내는 커밋으로, 두 브렌치의 변경 사항을 하나로 합치는 역할을 한다

            빨리감기
            - 빨리감기는 브렌치의 변경 사항을 다른 브렌치에 빠르게 적용하는 방법으로
            병합과는 달리 공통된 부분을 구하지 않고 변경 사항을 그대로 적용한다

            충돌
            - 충돌은 두 브렌치의 변경 사항이 서로 충돌하는 경우를 말한다
            - 예를 들어 A 브렌치에서 파일을 수정하고 B 브렌치에서도 같은 파일을 수정한 경우, 병합을 시도할 때 충돌이 발생할 수 있다
            - 충돌이 발생하면 수동으로 충돌을 해결해야 한다

        2. 두 브렌치를 합치는 과정 
        = Git에서 브랜치와 브랜치를 합치는 명령어를 'merge(머지)'라고 한다 이를 해석샇면 '병합'이 된다
        = 병합은 두 브렌치의 변경 사항을 하나로 합치는 과정으로
        - 먼저 병합하려는 브렌치로 이동한다
        - 그 다음 병합하려는 다른 브렌치를 지정하여 병합 명령어를 실행한다
        - Git은 두 브렌치의 변경 사항을 비교하여 공통된 부분을 찾아 병합 커밋을 생성한다
        - 만약 두 브렌치의 변경 사항이 충돌하는 경우, Git은 충돌을 표시하고 사용자가 수동으로 충돌을 해결하도록 요구한다
    -->
    
</body>
</html>
