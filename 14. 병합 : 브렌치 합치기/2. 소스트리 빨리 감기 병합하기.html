<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소스트리 빨리 감기 병합하기</title>
</head>
<body>

    <!-- 
        소스트리 빨리 감기 병합하기(내 파일 기준)
        1. 소스트리에서 'main' 브렌치로 체크아웃
        2. 병합하려는 커밋에서 마우스 오른쪽 버튼을 클릭하고 '병합'을 선택
        3. 해당 브랜치를 병합할 것인지를 묻는 대화 상자가 열린다 -> 'fast-forward가 가능해도 새 커밋으로 생성'에 체크하면 
        빨리 감기 병합이 가능하더라도 명시적으로 병합 커밋을 만든다 -> 브랜치 병합 기록이 명시적으로 남기 때문에 선호하는 개발자
        도 있다
        4. 로컬 저장소(내 컴퓨터)에서만 병합이 일어났기 때문에 'main'에 '2'가 있다 = 2개의 커밋이 로컬 저장소에서만 이뤄졌고
        원격 저장소에는 올라가지 않았다는 말
        5. 소스트리 상단에 'push' 아이콘에도 원격 저장소에 반영되지 않는 커밋 2개가 있다는 알림이 보인다
        6. 2개 다 커밋을 푸시를 한다 -> 'main' 브랜치에 '2'가 올라간다
    -->
    
</body>
</html>
