<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충동 병합 해결</title>
</head>
<body>

    <!-- 
        충동 병합 해결
        1. 파일이 충돌이 났기 때문에 스테이지 아래에 있는 것을 확인할 수 있다
        2. '비주얼 스튜디오'에 파일에 들어가면 Git이 충돌이 난 코드를 자동으로 마크한 것을 확일할 수 있다
        3. 코드를 보고 수정할 코드를 확인해서 수정
        4. 필요 없는 것은 삭제하고 충돌이 발생한 곳도 수정한다
        5. '소스트리'로 돌아와서 오른쪽 창에 '<<<, ==='등 특수문자가 없고 내가 최종본으로 원하는 대로 코드가 깔끔하게 바뀌어 있으면 충돌이 해결된 것
        6. 다시 병합을 재개하여 소스트리 상단의 '커밋'을 클릭
        7. 커밋 메세지 입력란에 텍스트가 자동으로 들어있다
        8. 충돌 파일들이 합쳐져서 '병합 커밋'이 새로 생겨 브렌치에 올라가 있는것을 확인할 수 있다
        9. 원격 저장소에 반영
        10. 이 병합 커밋을 이전 브렌치에도 반영할 차례
        11. '병합'을 클릭
        12. 이전 브렌치에 포인터가 최신 커밋을 확인
        13. 그러나 아직 원격 저장소에 있는 파일을 구버전이라 원격 저장소에도 반영('psuh'를 사용)
        14. 브렌치를가 모두 반영
        15. 원격 저장소 확인. 원격 저장소에 오랄온 브렌치들을 확인
    -->
    
</body>
</html>
