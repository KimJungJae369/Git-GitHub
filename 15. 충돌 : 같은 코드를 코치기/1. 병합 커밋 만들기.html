        병합 커밋 만들기

        Tip)
            'main'브랜치에서 바로 병합해도 되지만 충돌이 나더라도 'main'브랜치에서 해결하면 된다 다만 다른 사람이 불편해지는 상황을 방지하기 위해서 나만 쓰는 '파일'브랜치

        2. 병합하려는 커밋인 파일 브랜치의 최신 커밋에서 마우스 오른쪽 버튼을 클릭하고 '병합'을 선택

        4. '충동 병합' 메시지 창
