<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 브랜치 만들기</title>
</head>
<body>
    <!-- 
        1. 새로운 브랜치 만들기
        = 소스트리를 통해 마지막으로 했던 작업을 GitHub의 원격 저장소에 등록
        = 보통 하나의 개발 브랜치에는 한 사람만 작업해서 올리는 것이 바람직하다 
        = 그래야 버전이 꼬일 일이 없다
        = 그렇기 때문에 여러 사람이 작업하는 원격 저장소에는 미리 브랜치 규칙을 정하는 것이 일반적

        <간단한 네가지 규칙>
        1) master 브랜치는 절대 건드리지 않는다
        2) 개발 브랜치는 master 브랜치에서 새로 만들어서 작업한다
        3) 개발 브랜치 이름은 작업 내용과 관련된 이름으로 짓는다
        4) 작업이 끝나면 master 브랜치에 병합한다
        = 브랜치 규칙을 지키면 여러 사람이 작업하는 원격 저장소에서도 버전이 꼬이는 일이 없다

        <브랜치 만들기>
        1. '브랜치' 아이콘을 클릭 / 이 브랜치가 가리키는 커밋을 기준으로 새로운 브랜치를 만든다는 뜻
            Tip)
                - '새 브랜치 체크아웃'은 브랜치를 이동하는 명령어 
                - 그래서 '새 브랜치 체크아웃'을 클릭하면 브랜치를 만들면서 동시에 그 브랜치로 이동한다

        2. 브랜치 이름에 '/' 기호를 넣으면 앞에 적은 텍스트 '폴더'로 인식한다
            = 브랜치 이름에 '/' 기호를 넣어서 폴더로 인식하게 하면 브랜치 목록이 깔끔해진다
            - 이건 '소스트리'의 편의 기능
            - 텍스트가 두껍게 보이는 것을 통해 'HEAD'가 가리키는 브랜치라는 것을 알 수 있다

        3. 새파일 작성
        4. 새 파일을 커밋함
        5. 브랜츠의 '새 파일'이 커밋이 추가된 것을 확인
        6. 기존에 만들었던 파일을 열고 내용 추가
        7. 또 다시 커밋
        8. 커밋이 생성되면 브랜치 꼬리표도 붙는다 
        9. 브랜치에 추가한 커밋도 확인할 수 있다
    -->
    
</body>
</html>
