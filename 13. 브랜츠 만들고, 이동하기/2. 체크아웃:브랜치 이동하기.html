<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브랜치 이동하기</title>
</head>
<body>
    <!-- 
        체크아웃 : 브랜치 이동하기
        = '장바구니' 기능을 만들어야 하는 개발자
        = 이전 브랜치로 돌아가서 새로운 브랜치를 생성해야 하는데 이전 브랜치로 이동하지 않고 현재 브랜치를 만들려고 하면 기존 개발자의 수정본까지 모두 반영이 되는 문제가 발생
        = 브랜치를 이동하는 명령은 '체크아웃' 명령
        = 예시로 호텔에서 나갈 때 접수하는 체크아웃과 같은 의미로 생각하면 됨

        1. 소스트리 사이트바에서 '체크아웃'하려는 브랜치 이름을 마우스 오른쪽 버튼으로 클릭하고 '체크아웃'을 선택 혹은 체크아웃하려는 브랜치 이름을 더블 클릭하면 체크아웃이 됨

        2. 이전 브렌치가 체크아웃

        3. 소스트리 상단의 '브랜치'아이콘 클릭해 새 브랜치 생성 / 체크아웃한 브랜치에서 새 브랜치 생성하기

        4. 이전 버전으로 이동하고 새 브랜치 생성하기

        5. vscode에서 새 파일 만들기

        6. 소스 트리에서 커밋하기
        노랑 아이콘 : 새로 추가한 파일
        초록 아이콘 : 수정한 파일
    -->
    
</body>
</html>
