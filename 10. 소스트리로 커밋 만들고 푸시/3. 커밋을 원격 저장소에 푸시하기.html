<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커밋을 원격 저장소에 푸시하기</title>
</head>
<body>

    <!-- 
        커밋을 원격 저장소에 푸시하기
        1. 커밋 왼쪽에는 'origin/main'라는 꼬리표가 붙어있다 이는 중요한 의미 / 내 컴퓨터의 로컬 저장소의 버전은 '내 파일 추가'이고 원격 저장소의 버전은 한 단계 이전 버전인 '개발자 목록 추가'상태라는 것
            Tip) 커밋 옆의 꼬리표는 무엇을 의미?
            - 'origin'은 우리가 연결한 GutHub 원격 저장소의 닉네임
                git remote add origin hppts://guthub.com/사용자명/저장소명.git
            - 위 명령은 origin이란 이름으로 원격 저장소를 추가하라는 뜻
            - main은 처음에 저장소의 방이라고 했지만 사실은 우리가 커밋을 올리는 '줄기'의 이름
            - 내 컴퓨터의 로컬 저장소 버전은 '내 파일 추가'이고 원격 저장소의 버전은 한 단계 이전인 '개발자 목록 추가'상태라는 것을 의미

        2. 'push' 아이콘을 클릭하면 push 대화 상자가 나타난다 / 그다음 대화 상자의 'main'에 체크 / Git Bash에서의 git push origin main 명령과 동일

        3. 최신 커밋 확인
    -->
    
</body>
</html>
