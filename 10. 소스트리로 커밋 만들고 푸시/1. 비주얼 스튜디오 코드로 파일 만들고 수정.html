<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비주얼 스튜디오 코드로 파일 만들고 수정</title>
</head>
<body>

    <!-- 
        비주얼 스튜디오 코드로 파일 만들고 수정
        1. 'Visual Studio Code' 접속
        2. '폴더 열기 : 메뉴 -> 파일 -> 폴더 열기' 버튼을 클릭
        3. '기존 폴더'를 선택하고 '폴더 선택' 버튼을 클릭
        4. 기존에 만든 '파일' 선택
        5. '파일 아이콘'을 클릭하여 '파일 이름'을 변경
        6. 탭이 새로 열리면 내용을 새로 입력하고 저장
        7. 같은 방법으로 파일을 만들어 동일한 폴더에 저장

        Tip) md 확장자란?
        = 텍스트 파일을 나타낸다
        = md 확장자로 만든 파일은 '마크다운 문서'라고 부른다
        = '마크다운 문서'도 다른 프로그래밍 언어와 같이 간단한 문법이 있다
        = 예를 들어 텍스트 앞에 '#'을 붙이면 이름 문서의 제목으로 인식
        = 이처럼 서식을 활용해 보기 편한 문서를 만들 수 있는 것이 '마크다운 문법'
        = GitHub 등 마크다운 문법을 원하는 사이트에 md 파일을 올리면 보기 편한 문서로 보여준다
    -->
    
</body>
</html>
