<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정 파일 선택하고 커밋 만들기</title>
</head>
<body>

    <!-- 
        수정 파일 선택하고 커밋 만들기
        = 파일이 보이지 않는 이유는 직전에 만든 커밋과 비교했을 때 아무 변화가 없어기 때문에
        = 기존 커밋에 비해 새로 만들었거나 수정했거나 삭제한 파일은 모두 '수정된 파일'로 인식한다

        1. [스테이지에 올라가지 않는 파일] 섹션에서 파일 오른쪽에 있는 +버튼을 클릭
            Tip) 소스트리의 스테이지가 보이지 않으면
                - 삼단 버튼을 클릭해서 '스테이지 부 나누기'를 선택

        2. [스테이지에 올라간 파일]로 이동 / 이것은 Git Hub에서의 'git add feature-list.md' 명령어와 같다

        3. 커밋을 설명하는 메시지를 추가하는 명령
            Tip) 커밋을 만들 때는 메시지를 구체적으로 입력하는 것이 좋다
                - 나중에 내가 이 파일을 왜 수정했는지 알기도 쉽고 과거 커밋으로 돌아오는 일도 쉽기 떄문에(미래의 나를 위한 메모)

        4. 커밋에 성공하면 자동으로 [History] 화면으로 이동 -> 사이드바의 [파일 상태]를 클릭해 확인해 보면 작업 공간에 더 이상 수정할 파일이 없기 때문에 '커밋할 내용 없음'이라는 텍스트가 나온다

        5. 해당 커밋을 선택하면 아래 커밋의 상세 설명이 나온다
    -->
    
</body>
</html>
